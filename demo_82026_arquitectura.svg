<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img">
  <title>Arquitectura Demo 82026 - Pipeline Serverless</title>
  <desc>React, API Gateway, Lambda, S3, Athena, CDK, Python y GitHub Actions con LocalStack</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round"/>
    </marker>

    <!-- Usuario -->
    <symbol id="icon-user" viewBox="0 0 32 32">
      <circle cx="16" cy="10" r="5" fill="#d3d1c7"/>
      <path d="M8 26c0-5 3.6-9 8-9s8 4 8 9" fill="#d3d1c7"/>
    </symbol>

    <!-- React -->
    <symbol id="icon-react" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="3" fill="#61dafb"/>
      <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#61dafb" stroke-width="1.5"/>
      <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(60 16 16)"/>
      <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(120 16 16)"/>
    </symbol>

    <!-- API Gateway -->
    <symbol id="icon-apigw" viewBox="0 0 32 32">
      <path d="M4 8h24v16H4z" fill="none" stroke="#afabe8" stroke-width="1.5"/>
      <path d="M16 8v16M4 16h24" stroke="#afabe8" stroke-width="1.5"/>
      <path d="M10 12h4v8h-4zM18 12h4v8h-4z" fill="#afabe8" opacity="0.5"/>
    </symbol>

    <!-- Lambda -->
    <symbol id="icon-lambda" viewBox="0 0 32 32">
      <rect x="4" y="6" width="24" height="20" rx="3" fill="#ef9f27" opacity="0.25"/>
      <text x="16" y="22" text-anchor="middle" fill="#ef9f27" font-family="Arial,sans-serif" font-size="18" font-weight="bold">&#955;</text>
    </symbol>

    <!-- S3 -->
    <symbol id="icon-s3" viewBox="0 0 32 32">
      <path d="M6 14h20l-2 10H8z" fill="#5dcaa5"/>
      <ellipse cx="16" cy="14" rx="10" ry="3" fill="#9fe3cb"/>
      <path d="M10 11h12" stroke="#3d9a7a" stroke-width="1.5"/>
    </symbol>

    <!-- Athena -->
    <symbol id="icon-athena" viewBox="0 0 32 32">
      <circle cx="14" cy="14" r="7" fill="none" stroke="#f0997b" stroke-width="2"/>
      <path d="M19 19l6 6" stroke="#f0997b" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 22h12M8 18h8" stroke="#f0997b" stroke-width="1.2" opacity="0.7"/>
    </symbol>

    <!-- CDK -->
    <symbol id="icon-cdk" viewBox="0 0 32 32">
      <path d="M6 22 L16 8 L26 22 Z" fill="none" stroke="#97c459" stroke-width="1.5"/>
      <path d="M10 22 L16 14 L22 22 Z" fill="#97c459" opacity="0.35"/>
      <text x="16" y="26" text-anchor="middle" fill="#97c459" font-size="7" font-family="monospace">IaC</text>
    </symbol>

    <!-- Python -->
    <symbol id="icon-python" viewBox="0 0 32 32">
      <path d="M12 6h8c4 0 6 2 6 5v3h-7v-2h5c0-1-1-2-3-2h-6c-3 0-5 2-5 5v4c0 3 2 5 5 5" fill="#3b82f6"/>
      <path d="M20 26h-8c-4 0-6-2-6-5v-3h7v2H8c0 1 1 2 3 2h6c3 0 5-2 5-5v-4c0-3-2-5-5-5" fill="#fbbf24"/>
      <circle cx="13" cy="9" r="1.5" fill="#fff"/>
      <circle cx="19" cy="23" r="1.5" fill="#fff"/>
    </symbol>

    <!-- GitHub Actions -->
    <symbol id="icon-gh" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#b5b3a9" stroke-width="1.5"/>
      <path d="M11 16l4 4 8-10" fill="none" stroke="#b5b3a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- LocalStack -->
    <symbol id="icon-docker" viewBox="0 0 32 32">
      <rect x="6" y="14" width="5" height="4" rx="1" fill="#5ba4e8"/>
      <rect x="12" y="14" width="5" height="4" rx="1" fill="#5ba4e8"/>
      <rect x="18" y="14" width="5" height="4" rx="1" fill="#5ba4e8"/>
      <rect x="9" y="10" width="5" height="4" rx="1" fill="#5ba4e8"/>
      <rect x="15" y="10" width="5" height="4" rx="1" fill="#5ba4e8"/>
    </symbol>
