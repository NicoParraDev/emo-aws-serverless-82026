  <!-- Titulo -->
  <text x="340" y="14" text-anchor="middle" fill="#e8e6df" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Demo AWS Serverless 82026</text>

  <!-- LocalStack -->
  <rect x="40" y="28" width="600" height="532" rx="16" fill="none" stroke="rgba(222,220,209,0.35)" stroke-width="1" stroke-dasharray="6 4"/>
  <use href="#icon-docker" x="52" y="32" width="22" height="22"/>
  <text x="78" y="48" fill="#9c9a92" font-family="Segoe UI,Arial,sans-serif" font-size="12">LocalStack (simula AWS en :4566)</text>

  <!-- Usuario -->
  <rect x="260" y="52" width="160" height="56" rx="10" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
  <use href="#icon-user" x="272" y="64" width="32" height="32"/>
  <text x="355" y="76" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">Usuario</text>
  <text x="355" y="94" text-anchor="middle" fill="#b4b2a9" font-size="11" font-family="Segoe UI,Arial,sans-serif">Abre el navegador</text>

  <line x1="340" y1="108" x2="340" y2="128" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- React -->
  <rect x="220" y="128" width="240" height="56" rx="10" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
  <use href="#icon-react" x="232" y="140" width="32" height="32"/>
  <text x="365" y="152" text-anchor="middle" fill="#b5d4f4" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">React + TypeScript</text>
  <text x="365" y="170" text-anchor="middle" fill="#85b7eb" font-size="11" font-family="Segoe UI,Arial,sans-serif">frontend/ - localhost:3002</text>

  <line x1="340" y1="184" x2="340" y2="208" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="198" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">POST /procesar</text>

  <!-- API Gateway -->
  <rect x="200" y="208" width="280" height="56" rx="10" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
  <use href="#icon-apigw" x="212" y="220" width="32" height="32"/>
  <text x="365" y="232" text-anchor="middle" fill="#cec9f6" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">API Gateway</text>
  <text x="365" y="250" text-anchor="middle" fill="#afa9ec" font-size="11" font-family="Segoe UI,Arial,sans-serif">Express - localhost:3001</text>

  <line x1="340" y1="264" x2="340" y2="288" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="278" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">Invoca handler</text>

  <!-- Lambda -->
  <rect x="200" y="288" width="280" height="56" rx="10" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <use href="#icon-lambda" x="212" y="300" width="32" height="32"/>
  <text x="365" y="312" text-anchor="middle" fill="#fac775" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">Lambda (Node.js)</text>
  <text x="365" y="330" text-anchor="middle" fill="#ef9f27" font-size="11" font-family="Segoe UI,Arial,sans-serif">handler.ts - procesa texto</text>

  <line x1="340" y1="344" x2="340" y2="368" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="358" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">PutObject JSON</text>

  <!-- S3 -->
  <rect x="200" y="368" width="280" height="56" rx="10" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
  <use href="#icon-s3" x="212" y="380" width="32" height="32"/>
  <text x="365" y="392" text-anchor="middle" fill="#9fe1cb" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">S3 Bucket</text>
  <text x="365" y="410" text-anchor="middle" fill="#5dcaa5" font-size="11" font-family="Segoe UI,Arial,sans-serif">demo-resultados/resultados/</text>

  <line x1="340" y1="424" x2="340" y2="448" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="438" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">SQL sobre JSONs</text>

  <!-- Athena -->
  <rect x="200" y="448" width="280" height="56" rx="10" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
  <use href="#icon-athena" x="212" y="460" width="32" height="32"/>
  <text x="365" y="472" text-anchor="middle" fill="#f5c4b3" font-size="14" font-weight="500" font-family="Segoe UI,Arial,sans-serif">Athena</text>
  <text x="365" y="490" text-anchor="middle" fill="#f0997b" font-size="11" font-family="Segoe UI,Arial,sans-serif">SELECT * FROM resultados</text>

  <!-- CDK -->
  <rect x="52" y="288" width="120" height="80" rx="10" fill="#27500a" stroke="#97c459" stroke-width="0.5"/>
  <use href="#icon-cdk" x="64" y="308" width="32" height="32"/>
  <text x="125" y="328" text-anchor="middle" fill="#c0dd97" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif">AWS CDK</text>
  <text x="125" y="346" text-anchor="middle" fill="#97c459" font-size="10" font-family="Segoe UI,Arial,sans-serif">infrastructure/</text>
  <text x="125" y="360" text-anchor="middle" fill="#97c459" font-size="10" font-family="Segoe UI,Arial,sans-serif">IaC stack</text>
  <line x1="172" y1="328" x2="198" y2="328" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Python -->
  <rect x="508" y="368" width="118" height="80" rx="10" fill="#72243e" stroke="#ed93b1" stroke-width="0.5"/>
  <use href="#icon-python" x="520" y="388" width="32" height="32"/>
  <text x="567" y="408" text-anchor="middle" fill="#f4c0d1" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif">Python</text>
  <text x="567" y="426" text-anchor="middle" fill="#ed93b1" font-size="10" font-family="Segoe UI,Arial,sans-serif">read_s3_results</text>
  <text x="567" y="440" text-anchor="middle" fill="#ed93b1" font-size="10" font-family="Segoe UI,Arial,sans-serif">boto3 + tabla</text>
  <line x1="480" y1="396" x2="506" y2="396" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- GitHub Actions -->
  <rect x="508" y="208" width="118" height="56" rx="10" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
  <use href="#icon-gh" x="520" y="220" width="32" height="32"/>
  <text x="567" y="232" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="500" font-family="Segoe UI,Arial,sans-serif">GitHub Actions</text>
  <text x="567" y="250" text-anchor="middle" fill="#b4b2a9" font-size="10" font-family="Segoe UI,Arial,sans-serif">CI - build + cdk synth</text>
  <line x1="508" y1="236" x2="482" y2="236" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <rect x="52" y="572" width="12" height="12" rx="2" fill="none" stroke="rgba(222,220,209,0.35)" stroke-dasharray="4 3"/>
  <text x="70" y="582" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">Herramienta de soporte</text>
  <rect x="200" y="572" width="12" height="12" rx="2" fill="rgba(222,220,209,0.35)"/>
  <text x="218" y="582" fill="#9c9a92" font-size="11" font-family="Segoe UI,Arial,sans-serif">Flujo principal</text>
</svg>
